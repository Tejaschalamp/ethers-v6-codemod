# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: apply-transforms
    name: Apply Ethers.js Transforms
    type: automatic
    steps:
      - name: "Apply ethers v5 to v6 migration transforms"
        js-ast-grep:
          js_file: "./scripts/codemod.js"
          language: "javascript"
